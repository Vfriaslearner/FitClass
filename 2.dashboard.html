<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
<div class="campo-grupo">
  <label for="prof">Bem Vindo(a) Prof.</label>
  <input 
    type="text" 
    id="prof" 
    value=" Vitor Pereira" 
    class="input-read-only" 
    readonly
  >
</div>

<h1>Dashboard Coach</h1>

<div class="metrics-grid">
 <div class="metric-card">
    <span class="number">42</span>
    <span class="label">Alunos Ativos</span>

<div class="metric-card">
    <span class="number">18</span>
    <span class="label">Treinos</span>
 
 </div>      
</div>

<section class="recent-section">
    <h2 class="section-title">Alunos Recentes</h2>

<ul class="student-list">
    <li class="student-item">
        <span>João Silva</span>
        <span class="arrow">&gt;</span>
    </li>
    <li class="student-item">
        <span>Maria Souza</span>
        <span class="arrow">&gt;</span>
    </li>  
    
    <li class="student-item">
        <span>Pedro Lima</span>
        <span class="arrow">&gt;</span>
    </li>

</ul> 



    
</body>
</html>

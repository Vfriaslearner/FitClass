<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitClass | Cadastro de Professores</title>
</head>
<body>
    <div class="cad-profs">
       <form action="notificacao_cadastro_sucesso.html" method="post">
         <h1>Cadastro de Professores</h1>
         <p>Bem vindo(a) ao time,professor(a)!<br> Por favor,entre com os dados necessários <br> para liberarmos seu acesso a plataforma<br> o mais  rápido possível </p>
    
    
       <input type="text" placeholder="Nome Completo" id="nome" >
       <input type="date" placeholder="Data de Nascimento" id="Data de Nascimento" >
       <input type="text" placeholder="CREF" id="CREF" >
       <input type="tel" placeholder="Número para Contato" id="Número para Contato" >
       <input type="text" placeholder="CPF" id="CPF" >
       <button type="submit">Salvar Cadastro</button >
    </form>
    
    </div>

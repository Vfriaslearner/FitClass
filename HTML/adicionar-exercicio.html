<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/style.css">
    <title>FitClass | Adicionar Exercício</title>
</head>

   <dialog id="modal-salvar" class="modal-fitclass">
       <h3 style="margin-top:0; color:#1e293b; font-size:18px;">Adicionar Exercício ?</h3>
       <p style="color:#64748b; font-size:14px;margin-bottom:24px;"></p>

       <div style="display:flex; gap:10px; justify-content:flex-end;">
        <button type="button" onclick="document.getElementById('modal-salvar').close()" style="padding:8px 16px; border-radius:6px; border: 1px solid #cbd5e1; background:#f1f5f9; color:#506d8a; font-weight:600; cursor:pointer;  ">Cancelar</button>
      
        <button type="button" style="padding: 8px 16px; border-radius:6px; border:none;background: #2b49ab; color:white; font-weight:600; cursor:pointer;" onclick="document.getElementById('modal-salvar').close(); document.getElementById('modal-sucesso-salvar').showModal();">Confirmar</button> 
       </div>
    </dialog>   
    
    

    <dialog id="modal-sucesso-salvar" class="modal-fitclass">
    <h3 style="margin-top: 0; color: #000; font-size: 18px;">Tudo certo!</h3>
    <p style="color: #64748b; font-size: 15px; margin-bottom: 24px;margin-top: 10px;">Exercício Adicionado com Sucesso!</p>
    
    <div style="display: flex; justify-content:center; margin-top: 20px;">
      <a href="../HTML/prontuario_aluno.html" style="padding: 8px 20px; border-radius: 6px; background: #2b49ab; color: white; font-weight: 600; text-decoration: none; font-size: 15px; display: inline-block;">Ir ao prontuário do Aluno</a>
   
    </div>
</dialog>

    
<body>
    <main class="add-wkt-container">
        
        <h1 class="h1">Selecione a Parte do Corpo</h1> 

        <div class="form-etapa-bloco">
            <label class="etapa-label">1.Selecione a Região</label>
            <div class="add-exercicio-item">
                <span>...</span>
                <span class="arrow">&gt;</span>
            </div>
        </div>

        <div class="form-etapa-bloco">
            <label class="etapa-label">2.Selecione o Exercício...</label>
            <div class="add-exercicio-item">
                <span>Escolha a Região  Primeiro </span>
                <span class="arrow">&gt;</span>
            </div>
        </div>

        <div class="form-etapa-bloco">
            <label class="etapa-label">3. Defina a Qtde. de Séries</label>
            
             <div class="carousel-selector">
                <button type="button" class="carousel-btn">&lt;</button>
                <div class="carousel-items-track">
                    <span class="carousel-item">2</span>
                    <span class="carousel-item active">3</span>
                    <span class="carousel-item">4</span>
                    <span class="carousel-item">5</span>
                    <span class="carousel-item">6</span>
                </div>
                <button type="button" class="carousel-btn">&gt;</button>
             </div>
        </div>

        <div class="form-etapa-bloco">
            <label class="etapa-label">4. Repetições</label>
            
             <div class="carousel-selector">
                <button type="button" class="carousel-btn">&lt;</button>
                <div class="carousel-items-track">
                    <span class="carousel-item">2</span>
                    <span class="carousel-item active">3</span>
                    <span class="carousel-item">4</span>
                    <span class="carousel-item">5</span>
                    <span class="carousel-item">6</span>
                    <span class="carousel-item">7</span>
                    <span class="carousel-item">8</span>
                    <span class="carousel-item">9</span>
                    <span class="carousel-item">10</span>
                    <span class="carousel-item">11</span>
                    <span class="carousel-item">12</span>
                    <span class="carousel-item">13</span>
                    <span class="carousel-item">14</span>
                    <span class="carousel-item">15</span>
                </div>
                <button type="button" class="carousel-btn">&gt;</button>
             </div>
        </div>
        
        <div class="form-etapa-bloco">
            <label class="etapa-label">5.Intervalo de Descanso </label>
            
            <div class="carousel-selector">
                <button type="button" class="carousel-btn">&lt;</button>
                <div class="carousel-items-track">
                    <span class="carousel-item">30s</span>
                    <span class="carousel-item active">45s</span>
                    <span class="carousel-item">60s</span>
                    <span class="carousel-item">90s</span>
                    <span class="carousel-item">120s</span>
                </div>
                <button type="button" class="carousel-btn">&gt;</button>
             </div>
        </div>

        <textarea class="objetivo-aluno"
      rows="5"
      placeholder="Observações ?"
      maxlength="500"></textarea>
     


        <button type="button" onclick="document.getElementById('modal-salvar').showModal ();" style="margin-top: 20px;">Adicionar Exercício</button>


        
    </main>
  </body>
</html>

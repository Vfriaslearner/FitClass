<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="stylesheet" href="../CSS/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fit Class | Prontuário do Aluno</title>
</head>
   <body>
    <main class="prontuario-container">

       
      <nav class="top-carousel-nav">
        <div class="nav-track">
          <a href="../HTML/perfil.html" class="nav-item">Perfil</a>
          <a href="../HTML/dashboard.html" class="nav-item">Dashboard</a>
          <a href="../HTML/cadastro_alunos.html" class="nav-item">Cadastrar Aluno</a>
          <a href="../HTML/prontuario_aluno.html" class="nav-item-active">Prontuário de Aluno</a>
          <a href="../HTML/monitoramento-aluno.html" class="nav-item">Monitoramento de Aluno</a>
          <a href="../HTML/montagem-de-treino.html" class="nav-item">Montagem de Treino</a>

          <a href="#" class="nav-item btn-sair" onclick="event.preventDefault(); document.getElementById('modal-sair').showModal();">Sair</a>
        </div>
  
      </nav>
 
     <form class="prontuario-formulario">
        
      <h1 style="margin-top: 20px; margin-bottom: 20px;">Prontuário do Aluno</h1>
    <!--Vou colocar um input aqui,mas será para ser um selecionador de alunos.  Preciso ver como fazer isso-->
      <div class="field-group">   
       <input type="text" placeholder="Selecionar Aluno...  >"id="buscar-aluno">
       </div>

    <!--Vou colocar um botão de busca aqui e saber como implementar o processamento -->
     
    <section class="form-section">
      <h2 class="medidas-acima">Medidas Corporais</h2>
        <div class="metrics-grid">
         
          <div class="metric-card">
            <span class="number">50</span>
            <span class="label">Kg</span>
          </div>  
      
    
          <div class="metric-card">
            <span class="number">170</span>
            <span class="label">(cm)</span>
          </div> 
        </div>

     </section>
    
      <section class="form-section">
           
      <h2 class="sinais">Sinais Vitais (Bracelete) </h2>
       <div class="input-group">
        <input type="text" placeholder="Frequência Cardíaca" id="freq-cardiaca">
        <input type="text" placeholder="Pressão Arterial HGMG" id="pressao-arterial">
       </div>
     </section>
     
     <section class="form-section">
       
      <h2 class="aluno-stats">Status do Aluno</h2>    
        <input type="text" placeholder="Selecione o Status Físico" id="buscar-status-aluno">
     </section> 
      
      <section class="form-section">     
      <h2 class="objetivo">Objetivo</h2>
      
     <textarea class="objetivo-aluno"
      rows="5"
      placeholder="Coloque o objetivo do aluno aqui"
      maxlength="500"></textarea>
     </section>

     <div class="button-actions-prontuario">
    <button type="button" onclick="window.location.href='../HTML/cadastro_alunos.html'" id="cadastro-novo-aluno">Cadastrar novo(a) Aluno(a)</button>
    <button type="button" onclick="window.location.href='../HTML/dashboard.html'" id="voltar-dashboard">Voltar para Dashboard</button>
    </div>

     </form>
    </main>

      <dialog id="modal-sair" style="border: none; border-radius: 12px; padding: 20px;box-shadow: 0 10px 25px rgba(0,0,0,0.2);">
        <h3 style="margin-top:0; color:#1e293b;">Deseja Sair do Sistema ?</h3>
        <p style="color: #64748b; font-size: 14px; ">Você precisará fazer login novamente.</p>
        <div style="display:flex; gap: 10px; justify-content: flex-end; margin-top: 20px;">
          <button type="button" onclick="document.getElementById('modal-sair').close()" style="padding: 8px 16px; border-radius: 6px; border:1px solid #cbd5e1; background: #506d8a; cursor: pointer;">Cancelar</button>
          <button type="button" onclick="window.location.href='../HTML/login.html'" style="padding: 8px 16px;border-radius:6px; border:none; background: #dc2626; color: white; font-weight: 600; cursor:pointer;">Sim,sair</button>
        </div>
      </dialog> 
    
   </body>
 </html>

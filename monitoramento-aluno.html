<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Fitclass| Monitoramento do Aluno</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
      <main class="dashboard-container">
        <a href="dashboard.html" class="btn-voltar">&lt;</a>
        
         <h1>Monitoramento do Aluno</h1>
         <div class="campo-grupo">
           <button class="select-aluno" type="button"> 
            <span>Selecione o ALuno...</span>
            <span>&gt;</span>
            </button>
         </div>  

         <div class="linha-dado">
          <span class="rotulo-bold">IMC Auferido</span>
          <div class="caixa-valor"></div>
          <span class="unidade">mmhg</span>
         </div> 

         <div class="status-IMC">
          Sobrepeso (Amarelo)
         </div>

         <h2>Sinais Vitais</h2>
         
         <div class="linha-dado">
            <span class="rotulo-bold">FREQ. CARDÌACA -<br>(AVALIAÇÃO)</span>
            <div class="caixa-valor"></div>
            <span class="unidade">BPM</span>
          </div>  
         
         
         
         <div class="linha-dado">
            <span class="rotulo-bold">PRESSÂO ART. -<br>(AVALIAÇÃO)</span>
            <div class="caixa-valor"></div>
            <span class="unidade">mmhg</span>
          </div>  
         
          <h2>Aviso Legal</h2>
            <div class="alerta-legal">
             <p>Dados de batimentos/pressão são para acompanjamento e não substituem um diagnóstico médico</p>
            </div> 

<button type="button" onclick="window.location.href='montagem-de-treino.html'">Montar Treino</button>    

</main>    
</body>
</html>
